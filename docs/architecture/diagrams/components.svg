<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1240" viewBox="0 0 1720 1240" role="img" aria-labelledby="title desc"><title id="title">CMP-01. Компоненты и предлагаемый путь обработки</title><desc id="desc">MedPredict, 16 октября 2026. Сплошные элементы: существующий frontend. Пунктир: предлагаемая интеграция и не реализованные модели.</desc><rect width="1720" height="1240" fill="white" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" /></marker></defs><text font-family="Arial, sans-serif" font-size="28" text-anchor="start" font-weight="bold" x="35" y="45" fill="#172033"><tspan x="35" dy="0">CMP-01. Компоненты и предлагаемый путь обработки</tspan></text><text font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="normal" x="35" y="80" fill="#172033"><tspan x="35" dy="0">16.10.2026  |  Сплошная линия — существующий frontend; пунктир — план / согласование</tspan></text><rect x="40" y="135" width="1640" height="525" rx="0" stroke="#94a3b8" stroke-width="2" fill="#ffffff" /><text font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="bold" x="55" y="165" fill="#172033"><tspan x="55" dy="0">Браузер: существующий React + TypeScript frontend</tspan></text><rect x="40" y="705" width="1640" height="440" rx="0" stroke="#94a3b8" stroke-width="2" fill="#ffffff" stroke-dasharray="8 6" /><text font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="bold" x="55" y="735" fill="#172033"><tspan x="55" dy="0">Предлагаемая серверная часть; backend и модели не проверены в данном репозитории</tspan></text><rect x="80" y="210" width="330" height="100" rx="10" stroke="#475569" stroke-width="2" fill="#edf5fb" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="245.0" y="253.8" fill="#172033"><tspan x="245.0" dy="0">App / pages / Field / i18n</tspan><tspan x="245.0" dy="25">Навигация, поля, RU/KK/EN</tspan></text><rect x="510" y="210" width="350" height="100" rx="10" stroke="#475569" stroke-width="2" fill="#edf5fb" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="685.0" y="253.8" fill="#172033"><tspan x="685.0" dy="0">usePrediction</tspan><tspan x="685.0" dy="25">Состояния, отмена, снимок ввода</tspan></text><rect x="990" y="210" width="350" height="100" rx="10" stroke="#475569" stroke-width="2" fill="#edf5fb" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="1165.0" y="253.8" fill="#172033"><tspan x="1165.0" dy="0">validation.ts</tspan><tspan x="1165.0" dy="25">Проверка и преобразование ввода</tspan></text><rect x="990" y="340" width="350" height="100" rx="10" stroke="#475569" stroke-width="2" fill="#edf5fb" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" x="1165.0" y="371.95" fill="#172033"><tspan x="1165.0" dy="0">api/demo.ts — локальный demo</tspan><tspan x="1165.0" dy="24">Фиксированные 134,2 мм рт. ст.</tspan><tspan x="1165.0" dy="24">Нейронная сеть не вызывается</tspan></text><rect x="80" y="470" width="330" height="100" rx="10" stroke="#475569" stroke-width="2" fill="#edf5fb" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="245.0" y="513.8" fill="#172033"><tspan x="245.0" dy="0">api/http.ts + environment.ts</tspan><tspan x="245.0" dy="25">Явный real; timeout; GET / POST</tspan></text><rect x="510" y="470" width="350" height="100" rx="10" stroke="#475569" stroke-width="2" fill="#edf5fb" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="685.0" y="513.8" fill="#172033"><tspan x="685.0" dy="0">api/contract.ts</tspan><tspan x="685.0" dy="25">Проверка метаданных и ответа</tspan></text><rect x="990" y="470" width="350" height="100" rx="10" stroke="#475569" stroke-width="2" fill="#edf5fb" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="1165.0" y="513.8" fill="#172033"><tspan x="1165.0" dy="0">ResultPanel / PredictionPage</tspan><tspan x="1165.0" dy="25">Число, единицы, ввод, ограничения</tspan></text><rect x="1390" y="470" width="250" height="100" rx="10" stroke="#475569" stroke-width="2" fill="#edf5fb" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" x="1515.0" y="501.95" fill="#172033"><tspan x="1515.0" dy="0">pdf/report.ts</tspan><tspan x="1515.0" dy="24">Локальный PDF</tspan><tspan x="1515.0" dy="24">Без нового запроса</tspan></text><rect x="80" y="765" width="330" height="105" rx="10" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" stroke-dasharray="8 6" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" x="245.0" y="799.45" fill="#172033"><tspan x="245.0" dy="0">Spring Boot REST API</tspan><tspan x="245.0" dy="24">Предварительные GET / POST</tspan><tspan x="245.0" dy="24">Контракт требует согласования</tspan></text><rect x="510" y="765" width="350" height="105" rx="10" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" stroke-dasharray="8 6" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="685.0" y="798.8" fill="#172033"><tspan x="685.0" dy="0">Независимая валидация</tspan><tspan x="685.0" dy="25">и preprocessing</tspan><tspan x="685.0" dy="25">Правила из обучения модели</tspan></text><rect x="990" y="765" width="350" height="105" rx="10" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" stroke-dasharray="8 6" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" x="1165.0" y="799.45" fill="#172033"><tspan x="1165.0" dy="0">Model Inference</tspan><tspan x="1165.0" dy="24">Выбор совместимого артефакта</tspan><tspan x="1165.0" dy="24">Способ Java / Python не выбран</tspan></text><rect x="1390" y="765" width="250" height="105" rx="10" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" stroke-dasharray="8 6" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" x="1515.0" y="799.45" fill="#172033"><tspan x="1515.0" dy="0">API Response</tspan><tspan x="1515.0" dy="24">JSON: число, единица,</tspan><tspan x="1515.0" dy="24">версия / ошибка</tspan></text><rect x="80" y="1000" width="420" height="100" rx="10" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" stroke-dasharray="8 6" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" x="290.0" y="1031.95" fill="#172033"><tspan x="290.0" dy="0">M1 — Diabetes Progression</tspan><tspan x="290.0" dy="24">Регрессионный baseline + MLP</tspan><tspan x="290.0" dy="24">Не реализован; не диагноз</tspan></text><rect x="620" y="1000" width="420" height="100" rx="10" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" stroke-dasharray="8 6" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" x="830.0" y="1031.95" fill="#172033"><tspan x="830.0" dy="0">M2 — оценка систолического давления</tspan><tspan x="830.0" dy="24">NHANES; baseline + MLP; mmHg</tspan><tspan x="830.0" dy="24">Не реализован; не прогноз во времени</tspan></text><rect x="1160" y="1000" width="480" height="100" rx="10" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" stroke-dasharray="8 6" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" x="1400.0" y="1031.95" fill="#172033"><tspan x="1400.0" dy="0">M3 — краткосрочный прогноз глюкозы</tspan><tspan x="1400.0" dy="24">PhysioNet; временной baseline + нейросеть</tspan><tspan x="1400.0" dy="24">Не реализован; набор и горизонт не утверждены</tspan></text><path d="M 410 260 L 510 260" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="418.8" y="227" width="82.39999999999999" height="24" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" x="460" y="242" fill="#172033"><tspan x="460" dy="0">Действия</tspan></text><path d="M 860 260 L 990 260" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="883.8" y="227" width="82.39999999999999" height="24" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" x="925" y="242" fill="#172033"><tspan x="925" dy="0">Проверка</tspan></text><path d="M 510 285 L 460 285 L 460 520 L 410 520" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="425.9" y="380" width="48.199999999999996" height="24" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" x="450" y="395" fill="#172033"><tspan x="450" dy="0">real</tspan></text><path d="M 860 285 L 920 285 L 920 390 L 990 390" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="925.9" y="310" width="48.199999999999996" height="24" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" x="950" y="325" fill="#172033"><tspan x="950" dy="0">demo</tspan></text><path d="M 410 520 L 510 520" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="435.9" y="530" width="48.199999999999996" height="24" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" x="460" y="545" fill="#172033"><tspan x="460" dy="0">JSON</tspan></text><path d="M 685 470 L 685 310" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="601.05" y="390" width="167.89999999999998" height="24" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" x="685" y="405" fill="#172033"><tspan x="685" dy="0">Проверенные данные</tspan></text><path d="M 860 300 L 890 300 L 890 450 L 1165 450 L 1165 470" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><path d="M 1340 520 L 1390 520" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><path d="M 245 570 L 245 765" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><rect x="135.4" y="620" width="219.2" height="46" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" x="245" y="635" fill="#172033"><tspan x="245" dy="0">GET /api/v1/model/info</tspan><tspan x="245" dy="22">POST /api/v1/predictions</tspan></text><path d="M 410 818 L 510 818" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><path d="M 860 818 L 990 818" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><path d="M 1340 818 L 1390 818" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><path d="M 1515 765 L 1515 690 L 685 690 L 685 570" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><rect x="957.08" y="667" width="305.84" height="25" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" x="1110" y="683" fill="#172033"><tspan x="1110" dy="0">JSON → проверка → состояние → UI</tspan></text><path d="M 1165 870 L 1165 950 L 290 950 L 290 1000" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><path d="M 1165 950 L 830 950 L 830 1000" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><path d="M 1165 950 L 1400 950 L 1400 1000" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" x="80" y="930" fill="#172033"><tspan x="80" dy="0">Inference использует один выбранный модуль; все три модуля показаны как планируемые альтернативы, а не готовые сервисы.</tspan></text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" x="35" y="1190" fill="#172033"><tspan x="35" dy="0">Ввод хранится в памяти frontend; нет хранения показателей в localStorage/sessionStorage, аналитике или логах приложения.</tspan></text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" x="35" y="1220" fill="#172033"><tspan x="35" dy="0">API выбора модуля и формат временного ряда ещё не определены. Auth / постоянная история не входят в эту схему обработки.</tspan></text></svg>