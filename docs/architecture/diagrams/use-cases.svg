<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc"><title id="title">UC-01. Варианты использования MedPredict</title><desc id="desc">MedPredict, 16 октября 2026. Сплошные элементы: существующий frontend. Пунктир: предлагаемая интеграция и не реализованные модели.</desc><rect width="1600" height="1160" fill="white" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" /></marker></defs><text font-family="Arial, sans-serif" font-size="28" text-anchor="start" font-weight="bold" x="35" y="45" fill="#172033"><tspan x="35" dy="0">UC-01. Варианты использования MedPredict</tspan></text><text font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="normal" x="35" y="80" fill="#172033"><tspan x="35" dy="0">16.10.2026  |  Сплошная линия — существующий frontend; пунктир — план / согласование</tspan></text><rect x="350" y="135" width="850" height="900" rx="0" stroke="#94a3b8" stroke-width="2" fill="#ffffff" /><text font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="bold" x="365" y="165" fill="#172033"><tspan x="365" dy="0">Пользовательский сценарий MedPredict</tspan></text><circle cx="160.0" cy="453" r="16" stroke="#475569" stroke-width="2" fill="#edf5fb" /><path stroke-width="2" d="M 160.0 469 V 530 M 128.0 490 H 192.0 M 160.0 530 L 132.0 567 M 160.0 530 L 188.0 567" stroke="#475569" fill="none" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" x="160.0" y="595" fill="#172033"><tspan x="160.0" dy="0">Участник</tspan><tspan x="160.0" dy="24">демонстрации</tspan></text><circle cx="1430.0" cy="448" r="16" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" stroke-dasharray="8 6" /><path stroke-width="2" d="M 1430.0 464 V 525 M 1398.0 485 H 1462.0 M 1430.0 525 L 1402.0 562 M 1430.0 525 L 1458.0 562" stroke="#8b5e34" fill="none" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" x="1430.0" y="590" fill="#172033"><tspan x="1430.0" dy="0">Сервис прогноза</tspan><tspan x="1430.0" dy="24">Spring Boot — ПЛАН</tspan></text><ellipse cx="775.0" cy="240.0" rx="325.0" ry="45.0" stroke="#475569" stroke-width="2" fill="#edf5fb" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="775.0" y="233.8" fill="#172033"><tspan x="775.0" dy="0">UC-A. Изучить назначение, режим и ограничения</tspan><tspan x="775.0" dy="25">FR-01, FR-09; NFR-07</tspan></text><ellipse cx="775.0" cy="370.0" rx="325.0" ry="45.0" stroke="#475569" stroke-width="2" fill="#edf5fb" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="775.0" y="363.8" fill="#172033"><tspan x="775.0" dy="0">UC-B. Ввести и проверить показатели</tspan><tspan x="775.0" dy="25">FR-02, FR-03; NFR-02, NFR-03</tspan></text><ellipse cx="775.0" cy="500.0" rx="325.0" ry="45.0" stroke="#475569" stroke-width="2" fill="#edf5fb" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="775.0" y="493.8" fill="#172033"><tspan x="775.0" dy="0">UC-C. Запросить и изучить проверенный результат</tspan><tspan x="775.0" dy="25">FR-04, FR-07; FR-10 — настоящая интеграция в плане</tspan></text><ellipse cx="775.0" cy="630.0" rx="325.0" ry="45.0" stroke="#475569" stroke-width="2" fill="#edf5fb" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="775.0" y="623.8" fill="#172033"><tspan x="775.0" dy="0">UC-D. Отменить ожидание / исправить ошибку</tspan><tspan x="775.0" dy="25">FR-05, FR-06; NFR-05</tspan></text><ellipse cx="775.0" cy="760.0" rx="325.0" ry="45.0" stroke="#475569" stroke-width="2" fill="#edf5fb" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="775.0" y="753.8" fill="#172033"><tspan x="775.0" dy="0">UC-E. Экспортировать полученный результат в PDF</tspan><tspan x="775.0" dy="25">FR-08; NFR-01</tspan></text><ellipse cx="775.0" cy="905.0" rx="325.0" ry="60.0" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" stroke-dasharray="8 6" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="775.0" y="886.3" fill="#172033"><tspan x="775.0" dy="0">UC-F. Выбрать модуль и проверить доступность — ПЛАН</tspan><tspan x="775.0" dy="25">M1 / M2 / M3 пока не реализованы</tspan><tspan x="775.0" dy="25">FR-12, FR-13; модульный API не согласован</tspan></text><path d="M 255 510 L 365 510" fill="none" stroke="#475569" stroke-width="2" /><path d="M 365 240 L 365 905" fill="none" stroke="#475569" stroke-width="2" /><path d="M 365 240 L 450 240" fill="none" stroke="#475569" stroke-width="2" /><path d="M 365 370 L 450 370" fill="none" stroke="#475569" stroke-width="2" /><path d="M 365 500 L 450 500" fill="none" stroke="#475569" stroke-width="2" /><path d="M 365 630 L 450 630" fill="none" stroke="#475569" stroke-width="2" /><path d="M 365 760 L 450 760" fill="none" stroke="#475569" stroke-width="2" /><path d="M 365 905 L 450 905" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" /><path d="M 1000 455 L 1000 415" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><rect x="1034.525" y="425" width="90.94999999999999" height="24" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" x="1080" y="440" fill="#172033"><tspan x="1080" dy="0">«include»</tspan></text><path d="M 1100 500 L 1320 500" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" /><rect x="1194.76" y="464" width="50.48" height="25" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" x="1220" y="480" fill="#172033"><tspan x="1220" dy="0">real</tspan></text><path d="M 1100 905 L 1430 905 L 1430 640" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" /><rect x="1345.48" y="754" width="169.04" height="48" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" x="1430" y="770" fill="#172033"><tspan x="1430" dy="0">Каталог / статусы</tspan><tspan x="1430" dy="23">будущий контракт</tspan></text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" x="35" y="1080" fill="#172033"><tspan x="35" dy="0">Предусловие UC-E: успешный результат; новый POST не выполняется. Demo UC-C даёт только фиксированный пример.</tspan></text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" x="35" y="1115" fill="#172033"><tspan x="35" dy="0">Аккаунт, вход, история и удаление не являются работающими сценариями: действия отключены (FR-11).</tspan></text></svg>