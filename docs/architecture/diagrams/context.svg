<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">CTX-01. Контекст системы MedPredict</title><desc id="desc">MedPredict, 16 октября 2026. Сплошные элементы: существующий frontend. Пунктир: предлагаемая интеграция и не реализованные модели.</desc><rect width="1600" height="1040" fill="white" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" /></marker></defs><text font-family="Arial, sans-serif" font-size="28" text-anchor="start" font-weight="bold" x="35" y="45" fill="#172033"><tspan x="35" dy="0">CTX-01. Контекст системы MedPredict</tspan></text><text font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="normal" x="35" y="80" fill="#172033"><tspan x="35" dy="0">16.10.2026  |  Сплошная линия — существующий frontend; пунктир — план / согласование</tspan></text><rect x="270" y="140" width="1050" height="620" rx="0" stroke="#94a3b8" stroke-width="2" fill="#ffffff" /><text font-family="Arial, sans-serif" font-size="19" text-anchor="start" font-weight="bold" x="285" y="170" fill="#172033"><tspan x="285" dy="0">MedPredict — граница учебного прототипа</tspan></text><circle cx="117.5" cy="298" r="16" stroke="#475569" stroke-width="2" fill="#edf5fb" /><path stroke-width="2" d="M 117.5 314 V 375 M 85.5 335 H 149.5 M 117.5 375 L 89.5 412 M 117.5 375 L 145.5 412" stroke="#475569" fill="none" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" x="117.5" y="440" fill="#172033"><tspan x="117.5" dy="0">Участник</tspan><tspan x="117.5" dy="24">демонстрации</tspan></text><rect x="320" y="235" width="400" height="210" rx="10" stroke="#475569" stroke-width="2" fill="#edf5fb" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="520.0" y="308.8" fill="#172033"><tspan x="520.0" dy="0">React frontend — реализован</tspan><tspan x="520.0" dy="25">Ввод, проверка, состояния, RU/KK/EN</tspan><tspan x="520.0" dy="25">Demo: фиксированные 134,2 мм рт. ст.</tspan><tspan x="520.0" dy="25">Это не результат обученной модели</tspan></text><rect x="900" y="235" width="370" height="210" rx="10" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" stroke-dasharray="8 6" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="1085.0" y="308.8" fill="#172033"><tspan x="1085.0" dy="0">Spring Boot REST — предлагается</tspan><tspan x="1085.0" dy="25">Валидация, preprocessing, inference</tspan><tspan x="1085.0" dy="25">По сообщению команды — в работе;</tspan><tspan x="1085.0" dy="25">кода сервера здесь нет</tspan></text><rect x="900" y="535" width="370" height="165" rx="10" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" stroke-dasharray="8 6" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" x="1085.0" y="587.45" fill="#172033"><tspan x="1085.0" dy="0">Три независимых модуля — ПЛАН</tspan><tspan x="1085.0" dy="24">M1: числовой target Diabetes</tspan><tspan x="1085.0" dy="24">M2: оценка давления (NHANES)</tspan><tspan x="1085.0" dy="24">M3: прогноз глюкозы (PhysioNet)</tspan></text><rect x="1370" y="440" width="200" height="205" rx="10" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" stroke-dasharray="8 6" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" x="1470.0" y="500.45" fill="#172033"><tspan x="1470.0" dy="0">Кандидаты данных</tspan><tspan x="1470.0" dy="24">Diabetes / NHANES</tspan><tspan x="1470.0" dy="24">PhysioNet</tspan><tspan x="1470.0" dy="24">Выбор и права</tspan><tspan x="1470.0" dy="24">требуют согласования</tspan></text><rect x="320" y="845" width="400" height="95" rx="10" stroke="#475569" stroke-width="2" fill="#edf5fb" /><text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="520.0" y="886.3" fill="#172033"><tspan x="520.0" dy="0">PDF на устройстве пользователя</tspan><tspan x="520.0" dy="25">Экспорт существующего результата</tspan></text><rect x="900" y="845" width="370" height="115" rx="10" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" stroke-dasharray="8 6" /><text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" x="1085.0" y="884.45" fill="#172033"><tspan x="1085.0" dy="0">Команда: подготовка данных,</tspan><tspan x="1085.0" dy="24">обучение и оценка — отдельный процесс</tspan><tspan x="1085.0" dy="24">Артефакты пока не представлены</tspan></text><path d="M 200 340 L 320 340" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="234.76" y="304" width="50.48" height="25" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" x="260" y="320" fill="#172033"><tspan x="260" dy="0">Ввод</tspan></text><path d="M 320 405 L 200 405" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="176.05" y="420" width="167.89999999999998" height="24" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" x="260" y="435" fill="#172033"><tspan x="260" dy="0">Результат / ошибка</tspan></text><path d="M 720 300 L 900 300" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><rect x="721.775" y="245" width="176.45" height="46" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" x="810" y="260" fill="#172033"><tspan x="810" dy="0">GET / POST</tspan><tspan x="810" dy="22">предварительный API</tspan></text><path d="M 900 400 L 720 400" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><rect x="743.72" y="414" width="132.56" height="25" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" x="810" y="430" fill="#172033"><tspan x="810" dy="0">JSON / ошибки</tspan></text><path d="M 1085 445 L 1085 535" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><rect x="1114.6" y="480" width="150.79999999999998" height="24" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" x="1190" y="495" fill="#172033"><tspan x="1190" dy="0">Выбранный модуль</tspan></text><path d="M 520 445 L 520 845" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="430.92" y="669" width="178.16" height="48" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" x="520" y="685" fill="#172033"><tspan x="520" dy="0">Снимок</tspan><tspan x="520" dy="23">по явному действию</tspan></text><path d="M 1465 645 L 1465 900 L 1270 900" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><rect x="1388.28" y="774" width="123.44" height="48" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" x="1450" y="790" fill="#172033"><tspan x="1450" dy="0">Данные для</tspan><tspan x="1450" dy="23">исследования</tspan></text><path d="M 1085 845 L 1085 700" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" /><rect x="1008.12" y="769" width="223.76" height="48" fill="white" opacity=".96" /><text font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" x="1120" y="785" fill="#172033"><tspan x="1120" dy="0">Проверенный артефакт</tspan><tspan x="1120" dy="23">после обучения и оценки</tspan></text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" x="35" y="1000" fill="#172033"><tspan x="35" dy="0">Данные из demo не используются для обучения. Реальные данные пациентов и клиническое применение вне текущей демонстрации.</tspan></text></svg>