<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" width="1320" height="900" viewBox="0 0 1320 900" role="img">
  <title id="title">Варианты использования MedPredict</title>
  <desc id="desc">MedPredict. Состояние на 16 октября 2026. Пунктир обозначает планируемые компоненты или согласуемое взаимодействие.</desc>
  <rect width="1320" height="900" fill="white" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>
  <text font-family="Arial, sans-serif" font-size="26" text-anchor="start" font-weight="bold" x="40" y="45" fill="#172033">
    <tspan x="40" dy="0">Варианты использования MedPredict</tspan>
  </text>
  <text font-family="Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" x="40" y="77" fill="#172033">
    <tspan x="40" dy="0">16 октября 2026 · Сплошная линия — frontend; пунктир — план или согласование</tspan>
  </text>
  <rect x="330" y="110" width="740" height="650" rx="0" stroke="#64748b" stroke-width="2" fill="none" />
  <text font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="bold" x="348" y="138" fill="#172033">
    <tspan x="348" dy="0">MedPredict — граница пользовательского сценария</tspan>
  </text>
  <circle cx="145.0" cy="343" r="16" stroke="#64748b" stroke-width="2" fill="#f8fafc" />
  <path stroke-width="2" d="M 145.0 359 V 415 M 113.0 380 H 177.0 M 145.0 415 L 117.0 450 M 145.0 415 L 173.0 450" fill="none" stroke="#64748b" />
  <text font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" x="145.0" y="480" fill="#172033">
    <tspan x="145.0" dy="0">Исследователь /</tspan>
    <tspan x="145.0" dy="25">участник демо</tspan>
  </text>
  <rect x="1110" y="385" width="185" height="140" rx="12" stroke="#64748b" stroke-width="2" fill="#f8fafc" stroke-dasharray="8 6" />
  <text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="1202.5" y="437.0" fill="#172033">
    <tspan x="1202.5" dy="0">«система»</tspan>
    <tspan x="1202.5" dy="25">Backend + модель</tspan>
    <tspan x="1202.5" dy="25">План</tspan>
  </text>
  <ellipse cx="715.0" cy="225.0" rx="235.0" ry="45.0" stroke="#64748b" stroke-width="2" fill="#f8fafc" />
  <text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="715.0" y="219.0" fill="#172033">
    <tspan x="715.0" dy="0">UC-01 Ознакомиться</tspan>
    <tspan x="715.0" dy="25">с назначением и ограничениями</tspan>
  </text>
  <ellipse cx="715.0" cy="375.0" rx="235.0" ry="45.0" stroke="#64748b" stroke-width="2" fill="#f8fafc" />
  <text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="715.0" y="369.0" fill="#172033">
    <tspan x="715.0" dy="0">UC-02 Ввести</tspan>
    <tspan x="715.0" dy="25">и проверить данные</tspan>
  </text>
  <ellipse cx="715.0" cy="525.0" rx="235.0" ry="45.0" stroke="#64748b" stroke-width="2" fill="#f8fafc" />
  <text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="715.0" y="519.0" fill="#172033">
    <tspan x="715.0" dy="0">UC-03 Запросить</tspan>
    <tspan x="715.0" dy="25">и изучить результат</tspan>
  </text>
  <ellipse cx="715.0" cy="675.0" rx="235.0" ry="45.0" stroke="#64748b" stroke-width="2" fill="#f8fafc" />
  <text font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" x="715.0" y="669.0" fill="#172033">
    <tspan x="715.0" dy="0">UC-04 Экспортировать</tspan>
    <tspan x="715.0" dy="25">существующий результат</tspan>
  </text>
  <path d="M 250 375 L 480 225" fill="none" stroke="#475569" stroke-width="2" />
  <path d="M 250 410 L 480 375" fill="none" stroke="#475569" stroke-width="2" />
  <path d="M 250 455 L 480 525" fill="none" stroke="#475569" stroke-width="2" />
  <path d="M 250 490 L 480 675" fill="none" stroke="#475569" stroke-width="2" />
  <path d="M 715 480 L 715 420" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)" />
  <text font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" x="790" y="456" fill="#172033">
    <tspan x="790" dy="0">«include»</tspan>
  </text>
  <path d="M 950 525 L 1030 525 L 1030 480 L 1110 480" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" />
  <text font-family="Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" x="40" y="813" fill="#172033">
    <tspan x="40" dy="0">UC-03: в demo отвечает локальный адаптер; в real требуется согласованный API.</tspan>
  </text>
  <text font-family="Arial, sans-serif" font-size="17" text-anchor="start" font-weight="normal" x="40" y="848" fill="#172033">
    <tspan x="40" dy="0">UC-04: предусловие — успешный результат. Auth и история отключены и не входят в обязательный сценарий.</tspan>
  </text>
</svg>